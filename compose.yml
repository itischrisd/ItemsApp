services:
  app:
    build:
      context: ./app
    image: items-app:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: items
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./other/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d items" ]
      interval: 5s
      timeout: 5s
      retries: 5
